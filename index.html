    <meta name="description" content="MKR FinWise provides professional-grade investment allocation planners and fundamental stock analysis tools to empower investors with data-driven decision making." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              midnight: '#050817',
              deep: '#080D1C',
              navy: '#0D1426',
              warm: '#F7F7F5',
              bluegrey: '#9AA4B8',
              champagne: '#E8A72E',
              bright: '#F2B94B',
              slatenavy: '#20283A',
              icon: '#11182A',
              success: '#35C98A',
              danger: '#F06A6A',
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .premium-grid {
        background-image: radial-gradient(#9AA4B8 0.5px, transparent 0.5px);
        background-size: 24px 24px;
      }
      @media print {
        .no-print {
          display: none !important;
        }
        body {
          background-color: white !important;
          color: black !important;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        /* Ensure the dark dashboard prints with black background if user has background graphics enabled */
        .dark-banner {
          background-color: black !important;
          color: white !important;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        #report-content {
          padding: 0 !important;
          margin: 0 !important;
          box-shadow: none !important;
          border: none !important;
        }
      }
    </style>
